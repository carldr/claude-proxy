# Runs claude-proxy as a central service on docker-host.
# Set CLAUDE_PROXY_IMAGE and CLAUDE_PROXY_GATEWAY_AUTH_VERIFY_URL in `.env` beside this file. See README.md.
services:
  claude_proxy:
    image: ${CLAUDE_PROXY_IMAGE}
    restart: always
    ports:
      - "4100:4100"
    environment:
      CLAUDE_PROXY_PUBLIC_HOSTNAME: claude-proxy.example.com
      CLAUDE_PROXY_GATEWAY_AUTH_VERIFY_URL: ${CLAUDE_PROXY_GATEWAY_AUTH_VERIFY_URL}
    volumes:
      - claude-proxy-data:/data
    # The server accepts the loopback Host only from a loopback address, so the check runs inside the container.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/_proxy/api/subscription-account-status').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  claude-proxy-data:
