# Subscription accounts and the project routes between them.
#
# subscription_accounts: The accounts that the proxy can use. "name" identifies the account. "colour" is its colour in the web UI.
# Accounts log in from the web UI. This file holds no credentials.
#
# project_routes: Each route sends the requests of the projects that match "project_path_pattern" to "subscription_account".
# The pattern is a glob. A leading "~" means the home directory. A pattern also covers every subdirectory of a match.
# The first matching route wins.
#
# default_subscription_account: The account for a project that no route matches, and for a request with no project.
subscription_accounts:
  - name: Work
    colour: "#a1c63d"
  - name: Personal
    colour: "#ba8048"
project_routes:
  - project_path_pattern: ~/Development/client*
    subscription_account: Work
  - project_path_pattern: ~/Development/work-dev
    subscription_account: Work
default_subscription_account: Personal
