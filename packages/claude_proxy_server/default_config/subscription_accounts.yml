# Subscription accounts and the project routes between them.
#
# subscription_accounts: The accounts that the proxy can use. "name" identifies the account. "colour" is its colour in the web UI.
# "failover_utilization" is optional. The proxy avoids the account at or above this fraction of its 5-hour or weekly limit.
# The default is 1, which means no threshold. Accounts log in from the web UI. This file holds no credentials.
#
# project_routes: Each route sends the requests of the projects that match "project_path_pattern" to "subscription_account".
# The pattern is a glob. The pattern must be an absolute path: "~" is not expanded. A pattern also covers every subdirectory of a match.
# The first matching route wins.
#
# default_subscription_account: The account for a project that no route matches, and for a request with no project.
#
# project_names: The names that the web UI shows and filters by. In "project_path_pattern", "*" matches inside one directory,
# and "{project_name}" matches one directory and names the project. A rule without "{project_name}" has a "project_name" key.
# A pattern also covers every subdirectory of a match. The first matching rule wins. Without a match, the last directory is the name.
# Example:
# project_names:
#   - project_path_pattern: /srv/roy/*/*/{project_name}/@
#   - project_path_pattern: /Users/example_user/Development/games/{project_name}
subscription_accounts:
  - name: Work
    colour: "#a1c63d"
    # This keeps the last 2% for programs that use the account without the proxy.
    failover_utilization: 0.98
  - name: Personal
    colour: "#ba8048"
project_routes:
  - project_path_pattern: /Users/example_user/Development/client*
    subscription_account: Work
  - project_path_pattern: /Users/example_user/Development/work-dev
    subscription_account: Work
default_subscription_account: Personal
