# US dollars per million tokens, used to estimate the cost of each request.
# A model ID matches the longest entry that is a prefix of it,
# so "claude-haiku-4-5" also prices "claude-haiku-4-5-20251001".
# Cache writes cost 1.25x input for the 5-minute TTL and 2x input for the 1-hour TTL.
